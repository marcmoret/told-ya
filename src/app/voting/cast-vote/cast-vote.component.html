<div class="topic-section">
  <h2 class="topic-title">{{argument?.topic}}</h2>
</div>

<div class="challengers">
  <div class="challenger challenger-a">
    <div class="challenger-accent"></div>
    <h4 class="challenger-name">{{argument?.personA}}</h4>
    <p class="challenger-argument">{{argument?.argumentA}}</p>
    <div class="vote-action">
      <button class="vote-btn vote-btn-a" (click)="castVote('A')" [disabled]="loadingA">
        @if (loadingA) {
          <span class="spinner"></span>
        } @else {
          Vote for {{argument?.personA}}
        }
      </button>
    </div>
  </div>

  <div class="vs-divider">
    <span class="vs-badge">VS</span>
  </div>

  <div class="challenger challenger-b">
    <div class="challenger-accent"></div>
    <h4 class="challenger-name">{{argument?.personB}}</h4>
    <p class="challenger-argument">{{argument?.argumentB}}</p>
    <div class="vote-action">
      <button class="vote-btn vote-btn-b" (click)="castVote('B')" [disabled]="loadingB">
        @if (loadingB) {
          <span class="spinner"></span>
        } @else {
          Vote for {{argument?.personB}}
        }
      </button>
    </div>
  </div>
</div>
