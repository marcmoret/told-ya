<section class="vote-options">
  <article class="vote-card">
    <p class="vote-card__label">Side A</p>
    <h2>{{ argument.personA }}</h2>
    <p class="vote-card__body">{{ argument.argumentA }}</p>
    @if (canVote) {
      <button
        class="vote-card__button"
        type="button"
        (click)="castVote('A')"
        [disabled]="pendingSide !== null"
      >
        {{ pendingSide === 'A' ? 'Submitting...' : 'Vote for ' + argument.personA }}
      </button>
    }
  </article>

  <article class="vote-card vote-card--secondary">
    <p class="vote-card__label">Side B</p>
    <h2>{{ argument.personB }}</h2>
    <p class="vote-card__body">{{ argument.argumentB }}</p>
    @if (canVote) {
      <button
        class="vote-card__button vote-card__button--secondary"
        type="button"
        (click)="castVote('B')"
        [disabled]="pendingSide !== null"
      >
        {{ pendingSide === 'B' ? 'Submitting...' : 'Vote for ' + argument.personB }}
      </button>
    }
  </article>
</section>

@if (errorMessage) {
  <p class="vote-options__error">{{ errorMessage }}</p>
}
