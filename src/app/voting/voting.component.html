<mat-card class="voting-card glass-card">
  <mat-card-content>
    <h1 class="voting-title gradient-text">Voting Booth</h1>
    <div class="chart-container" [class.chart-hidden]="isEligible">
      <canvas id="myChart"></canvas>
    </div>
    @if (isEligible) {
      <app-cast-vote
        (castVoted)="getArgument()"
        [argument]="argument"
        [docId]="docId"
        [voterId]="voterId"
      ></app-cast-vote>
    }
  </mat-card-content>
</mat-card>
